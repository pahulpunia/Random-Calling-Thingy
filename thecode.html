<!DOCTYPE html>
// I am not gonna go out and say this work is mine, yes its basically made entirely by Gemini. 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Random Calling Thingy</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .top-btns { position: absolute; top: 15px; left: 15px; z-index: 9999; display: flex; gap: 10px; }
        .icon-btn { background: rgba(255,255,255,0.1); border: 1px solid #444; color: white; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; backdrop-filter: blur(5px); transition: 0.2s; }
        .icon-btn:hover { background: rgba(255,255,255,0.2); }

        #setup { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 12px; background: #181818; width: 100%; }
        .setup-box { background: #222; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; width: 320px; border: 1px solid #333; }
        #main-room { display: none; flex-direction: row; height: 100%; width: 100%; }
        
        #video-wrapper { display:flex; flex-direction:column; flex:1; position: relative; transition: 0.3s; }
        #video-section { flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; padding: 20px; background: #000; overflow-y: auto; align-items: center; justify-items: center; align-content: center;}
        .video-container { position: relative; background: #1a1a1a; border-radius: 12px; overflow: hidden; border: 2px solid #333; width: 100%; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        .video-controls { position: absolute; top: 10px; right: 10px; z-index: 10; display: flex; gap: 5px; }
        .action-btn { background: rgba(0,0,0,0.7); color: white; border: 1px solid #666; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; transition: 0.2s; }
        .action-btn.kick:hover { background: #e67e22; border-color: #e67e22; }
        .action-btn.ban:hover { background: #e74c3c; border-color: #e74c3c; }
        .label { position: absolute; bottom: 10px; left: 10px; background: rgba(41, 128, 185, 0.9); padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; z-index: 10; }

        #chat-sidebar { width: 320px; background: #181818; border-left: 1px solid #333; display: flex; flex-direction: column; transition: 0.3s; }
        #msg-history { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 14px; border-radius: 8px; background: #2a2a2a; max-width: 85%; font-size: 14px; word-wrap: break-word; line-height: 1.4; }
        .msg.me { background: #2980b9; align-self: flex-end; }
        .sys-msg { text-align: center; font-size: 12px; color: #888; font-style: italic; margin: 5px 0; }
        .sys-warn { color: #e74c3c; font-weight: bold; }
        
        .cmd-box { background: #222; border: 1px solid #2980b9; border-radius: 8px; padding: 12px; font-size: 13px; color: #ddd; margin: 5px 0; }
        .cmd-box ul { margin: 8px 0 0 0; padding-left: 20px; }
        .cmd-box li { margin-bottom: 4px; }
        
        .toolbar { padding: 15px; background: #181818; display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; border-top: 1px solid #333; }
        .btn { padding: 10px 15px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 14px; }
        .btn:hover { opacity: 0.8; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: #2980b9; color: white; width: 100%; margin-bottom: 5px; }
        .btn-join { background: #444; color: white; width: 100%; }
        .btn-tool { background: #333; color: white; border: 1px solid #555; }
        
        input { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #252525; color: white; box-sizing: border-box; outline: none; margin-bottom: 10px; }
        
        .chat-input-wrapper { display: flex; gap: 5px; padding: 15px; border-top: 1px solid #333; background: #1a1a1a; }
        .chat-input-wrapper input { margin: 0; }

        /* Modals */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 10000; justify-content: center; align-items: center; backdrop-filter: blur(3px); }
        .modal { background: #222; padding: 25px; border-radius: 12px; width: 350px; max-width: 90%; border: 1px solid #444; position: relative; }
        .modal h3 { margin-top: 0; color: #2980b9; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .modal-close { position: absolute; top: 15px; right: 15px; cursor: pointer; color: #aaa; font-weight: bold; font-size: 18px; }
        .modal-close:hover { color: white; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 14px; }
        .setting-row input[type="number"] { width: 80px; margin-bottom: 0; padding: 8px; }

        #lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; justify-content: center; align-items: center; }
        #lightbox img { max-width: 90%; max-height: 90%; border-radius: 8px; }

        @media (max-width: 768px) {
            #main-room { flex-direction: column; }
            #chat-sidebar { width: 100%; height: 40vh; border-left: none; border-top: 1px solid #333; }
            .toolbar { flex-wrap: nowrap; overflow-x: auto; padding: 10px; }
            .btn { white-space: nowrap; font-size: 12px; padding: 8px 10px; }
        }
    </style>
</head>
<body>

<div class="top-btns">
    <button class="icon-btn" onclick="toggleAppFullscreen()">⛶ Fullscreen</button>
    <button class="icon-btn" onclick="openModal('client-settings-modal')">⚙️ Settings</button>
</div>

<div id="setup">
    <div class="setup-box">
        <h2 style="color: #2980b9; margin-top: 0;">Random Calling Thingy</h2>
        <input type="text" id="user-name" placeholder="Your Name" style="text-align: center;">
        <input type="text" id="room-id" placeholder="Private Room Code" style="text-align: center;">
        <button class="btn btn-primary" onclick="initPeer(true)">Host Private Room</button>
        <button class="btn btn-join" onclick="initPeer(false)">Join Private Room</button>
        <hr style="border: none; border-top: 1px solid #444; margin: 20px 0;">
        <button class="btn" style="background: #27ae60; color: white; width: 100%;" onclick="joinGeneral()">🌐 Join General Meeting</button>
    </div>
</div>

<div id="main-room">
    <div id="video-wrapper">
        <div id="video-section">
            <div class="video-container" id="local-cont">
                <video id="localVideo" autoplay muted playsinline></video>
                <div class="label" id="local-label">You</div>
            </div>
        </div>
        
        <div class="toolbar">
            <button id="mic-btn" class="btn btn-tool" onclick="toggleMic()">🎤 Mic (Hold Space)</button>
            <button id="cam-btn" class="btn btn-tool" onclick="toggleCam()">📸 Cam On</button>
            <button id="share-btn" class="btn btn-tool" onclick="startScreen()">🖥️ Share</button>
            <button class="btn" style="background: #e74c3c; color: white; margin-left: auto;" onclick="leaveRoom()">Leave</button>
        </div>
    </div>

    <div id="chat-sidebar">
        <div style="padding: 15px; font-weight: bold; border-bottom: 1px solid #333; background: #1a1a1a;">
            Meeting Chat <span id="room-display" style="float:right; color: #2980b9; font-size: 12px;"></span>
        </div>
        <div id="msg-history"></div>
        <div class="chat-input-wrapper">
            <input type="file" id="file-input" style="display: none;" accept="image/*" onchange="sendImage(this)">
            <button class="btn btn-tool" id="attach-btn" onclick="document.getElementById('file-input').click()">📎</button>
            <input type="text" id="chat-input" placeholder="Type a message or !help">
        </div>
    </div>
</div>

<div id="lightbox" onclick="this.style.display='none'">
    <img id="lightbox-img" src="">
</div>

<div id="client-settings-modal" class="modal-overlay" onclick="closeModal(event, 'client-settings-modal')">
    <div class="modal">
        <div class="modal-close" onclick="document.getElementById('client-settings-modal').style.display='none'">✖</div>
        <h3>Client Settings</h3>
        <div class="setting-row">
            <span>Audio Only Mode</span>
            <input type="checkbox" id="set-audio-only" onchange="applyClientSettings()">
        </div>
        <div class="setting-row">
            <span>Text Only Mode</span>
            <input type="checkbox" id="set-text-only" onchange="applyClientSettings()">
        </div>
        <div class="setting-row">
            <span>Hide System Messages</span>
            <input type="checkbox" id="set-hide-sys">
        </div>
    </div>
</div>

<div id="host-settings-modal" class="modal-overlay" onclick="closeModal(event, 'host-settings-modal')">
    <div class="modal">
        <div class="modal-close" onclick="document.getElementById('host-settings-modal').style.display='none'">✖</div>
        <h3>👑 Host Controls</h3>
        <div class="setting-row">
            <span>Max Room Capacity</span>
            <input type="number" id="host-capacity" value="50" min="2" max="100">
        </div>
        <button class="btn btn-tool" style="width: 100%; margin-bottom: 10px;" onclick="openBanList()">View Ban List</button>
        <button class="btn" style="background: #e74c3c; color: white; width: 100%;" onclick="closeRoomEntirely()">⚠️ Close Room & Kick All</button>
    </div>
</div>

<div id="ban-list-modal" class="modal-overlay" onclick="closeModal(event, 'ban-list-modal')">
    <div class="modal">
        <div class="modal-close" onclick="document.getElementById('ban-list-modal').style.display='none'">✖</div>
        <h3>Ban List</h3>
        <div id="ban-list-content" style="max-height: 200px; overflow-y: auto; font-size: 13px; color: #ccc;">
            No users banned.
        </div>
    </div>
</div>

<script>
    const GENERAL_ROOM_ID = "randomcall-public-lobby-2026";
    let peer, localStream, screenStream, currentRoomId, isHostFlag, myUsername;
    let conns = {}; calls = {}; connectedPeers = new Set(); 
    
    // Ban & Moderation Memory
    let bannedPeers = new Set(); 
    let bannedNames = new Set(); 
    let roomStartTime = null;
    let knownHostName = "Unknown";
    let hostSettings = { maxCapacity: 50 };
    
    // Rate Limiting Trackers
    let joinTimestamps = []; 
    let joinLockUntil = 0;   
    
    let msgTimestamps = [];  
    let isChatLocked = false;
    let spamInfractions = 0;
    
    let isMicOn = true; let isCamOn = true;
    let clientPrefs = { audioOnly: false, textOnly: false, hideSys: false };

    // --- MODAL & UI LOGIC ---
    function toggleAppFullscreen() {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(e => {});
        else document.exitFullscreen();
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(e, id) { if (e.target.id === id) document.getElementById(id).style.display = 'none'; }

    function applyClientSettings() {
        clientPrefs.audioOnly = document.getElementById('set-audio-only').checked;
        clientPrefs.textOnly = document.getElementById('set-text-only').checked;
        clientPrefs.hideSys = document.getElementById('set-hide-sys').checked;

        const vidSection = document.getElementById('video-section');
        const vidWrapper = document.getElementById('video-wrapper');

        if (clientPrefs.textOnly) {
            vidWrapper.style.display = 'none';
            if (isMicOn) toggleMic();
            if (isCamOn) toggleCam();
            document.getElementById('mic-btn').disabled = true;
            document.getElementById('cam-btn').disabled = true;
            document.getElementById('share-btn').disabled = true;
        } else {
            vidWrapper.style.display = 'flex';
            document.getElementById('mic-btn').disabled = false;
            document.getElementById('cam-btn').disabled = false;
            document.getElementById('share-btn').disabled = false;
            
            if (clientPrefs.audioOnly) {
                if (isCamOn) toggleCam();
                document.getElementById('cam-btn').disabled = true;
                vidSection.style.display = 'none'; 
            } else {
                document.getElementById('cam-btn').disabled = false;
                vidSection.style.display = 'grid'; 
            }
        }
    }

    function updateNameplate(id, name) {
        if (!name || name === "User" || name === "Connecting...") return;
        if (conns[id]) conns[id].remoteName = name;
        const labelEl = document.querySelector(`#cont-${id} .label`);
        if (labelEl) labelEl.innerText = name;
    }

    // --- INITIALIZATION ---
    function joinGeneral() { document.getElementById('room-id').value = GENERAL_ROOM_ID; initPeer(false, true); }

    async function initPeer(isHost, isAutoGeneral = false) {
        myUsername = document.getElementById('user-name').value.trim() || "Anonymous";
        const id = document.getElementById('room-id').value.trim();
        if (!id) return alert("Enter a room code!");

        currentRoomId = id; isHostFlag = isHost; knownHostName = isHost ? myUsername : "Unknown";

        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: { width: { max: 640 }, frameRate: { max: 24 } }, audio: true });
            document.getElementById('localVideo').srcObject = localStream;
            document.getElementById('local-label').innerText = myUsername + " (You)";
            
            if (clientPrefs.audioOnly || clientPrefs.textOnly) { isCamOn = true; toggleCam(); }
            if (clientPrefs.textOnly) { isMicOn = true; toggleMic(); }
        } catch (e) {
            return alert("Could not access camera/microphone. Check permissions.");
        }

        peer = isHost ? new Peer(id) : new Peer();

        peer.on('open', (myId) => {
            document.getElementById('setup').style.display = 'none';
            document.getElementById('main-room').style.display = 'flex';
            document.getElementById('room-display').innerText = id === GENERAL_ROOM_ID ? "General" : id;
            roomStartTime = Date.now();
            appendSystemMsg(`Welcome! Type !help for commands.`);
            
            if (!isHost) connectToPeer(id); 
        });

        peer.on('error', err => {
            if (err.type === 'peer-unavailable' && isAutoGeneral) { peer.destroy(); initPeer(true); } 
            else { alert("Connection Error: " + err.type); leaveRoom(); }
        });

        peer.on('connection', c => setupConn(c));
        
        peer.on('call', call => {
            const incomingName = call.metadata?.name?.toLowerCase();
            
            if (isHostFlag) {
                hostSettings.maxCapacity = parseInt(document.getElementById('host-capacity').value) || 50;
                if (connectedPeers.size + 1 >= hostSettings.maxCapacity) return call.close();
                if (Date.now() < joinLockUntil) return call.close();
                if (bannedPeers.has(call.peer) || (incomingName && bannedNames.has(incomingName))) return call.close();
            }

            call.answer(localStream); calls[call.peer] = call;
            call.on('stream', s => {
                let displayName = call.metadata?.name || conns[call.peer]?.remoteName || "Connecting...";
                addVideo(s, displayName, call.peer);
                updateNameplate(call.peer, displayName); 
            });
            call.on('close', () => dropPeer(call.peer));
        });
    }

    function leaveRoom() {
        if (peer) peer.destroy();
        if (localStream) localStream.getTracks().forEach(t => t.stop());
        if (screenStream) screenStream.getTracks().forEach(t => t.stop());
        
        conns = {}; calls = {}; connectedPeers = new Set();
        if (isHostFlag) { bannedPeers = new Set(); bannedNames = new Set(); } 
        
        roomStartTime = null;
        spamInfractions = 0; 
        msgTimestamps = [];
        isChatLocked = false;
        
        const chatInp = document.getElementById('chat-input');
        chatInp.disabled = false;
        chatInp.placeholder = "Type a message or !help";
        document.getElementById('attach-btn').disabled = false;
        
        document.querySelectorAll('.remote-vid').forEach(el => el.remove());
        document.getElementById('msg-history').innerHTML = '';
        document.getElementById('main-room').style.display = 'none';
        document.getElementById('setup').style.display = 'flex';
        document.getElementById('host-settings-modal').style.display = 'none';
    }

    function dropPeer(id) {
        if (conns[id]) { conns[id].close(); delete conns[id]; }
        if (calls[id]) { calls[id].close(); delete calls[id]; }
        connectedPeers.delete(id);
        document.getElementById('cont-' + id)?.remove();

        if (isHostFlag && connectedPeers.size === 0) {
            bannedPeers.clear(); bannedNames.clear();
        }
    }

    // --- HOST MODERATION FUNCTIONS ---
    function executeKick(targetId) {
        if (!isHostFlag) return;
        broadcast({ type: 'sys-kick', target: targetId });
        dropPeer(targetId); appendSystemMsg("You kicked a user.");
    }

    function executeBan(targetId) {
        if (!isHostFlag) return;
        const targetName = conns[targetId]?.remoteName || calls[targetId]?.metadata?.name;
        bannedPeers.add(targetId);
        if (targetName && targetName !== "User" && targetName !== "Connecting...") bannedNames.add(targetName.toLowerCase());
        
        broadcast({ type: 'sys-ban', target: targetId });
        dropPeer(targetId); appendSystemMsg(`You banned ${targetName || "a user"}.`);
    }

    function openBanList() {
        const content = document.getElementById('ban-list-content');
        if (bannedNames.size === 0 && bannedPeers.size === 0) {
            content.innerHTML = "No users are currently banned.";
        } else {
            let html = "<ul>";
            bannedNames.forEach(n => html += `<li>Name: ${n}</li>`);
            bannedPeers.forEach(p => html += `<li>ID: ${p.substring(0,8)}...</li>`);
            html += "</ul>";
            content.innerHTML = html;
        }
        document.getElementById('ban-list-modal').style.display = 'flex';
    }

    function closeRoomEntirely() {
        if (!isHostFlag || !confirm("Are you sure? This will kick everyone and end the session.")) return;
        broadcast({ type: 'sys-room-close' });
        setTimeout(() => leaveRoom(), 500); 
    }

    // --- CONNECTION LOGIC ---
    function connectToPeer(targetId) {
        if (connectedPeers.has(targetId) || targetId === peer.id) return;
        
        const c = peer.connect(targetId, { metadata: { name: myUsername } });
        c.on('open', () => setupConn(c));
        
        const call = peer.call(targetId, localStream, { metadata: { name: myUsername } });
        calls[targetId] = call;
        call.on('stream', s => {
            let displayName = conns[targetId]?.remoteName || "Connecting...";
            addVideo(s, displayName, targetId); updateNameplate(targetId, displayName);
        });
        call.on('close', () => dropPeer(targetId));
    }

    function setupConn(c) {
        const incomingName = c.metadata?.name?.toLowerCase();
        
        // --- HOST VALIDATIONS (LAYER 1) ---
        if (isHostFlag) {
            const now = Date.now();
            hostSettings.maxCapacity = parseInt(document.getElementById('host-capacity').value) || 50;

            if (now < joinLockUntil) {
                c.on('open', () => { c.send({ type: 'sys-reject', reason: "Room is currently overwhelmed. Try again in a few seconds." }); setTimeout(() => c.close(), 500); });
                return; 
            }
            joinTimestamps.push(now);
            joinTimestamps = joinTimestamps.filter(t => now - t <= 5000);
            if (joinTimestamps.length >= 4) {
                joinLockUntil = now + 5000;
                appendSystemMsg("⚠️ Join surge detected. Room locked for 5 seconds.");
            }

            if (connectedPeers.size + 1 >= hostSettings.maxCapacity) {
                c.on('open', () => { c.send({ type: 'sys-reject', reason: "Room is at capacity." }); setTimeout(() => c.close(), 500); });
                return; 
            }

            if (bannedPeers.has(c.peer) || (incomingName && bannedNames.has(incomingName))) {
                c.on('open', () => { c.send({ type: 'sys-ban', target: c.peer }); setTimeout(() => c.close(), 500); });
                return; 
            }
        }

        conns[c.peer] = c; connectedPeers.add(c.peer);
        c.remoteName = c.metadata?.name || "User"; 
        c.recentMessages = []; // SECURITY: Setup receiver-side tracking for this peer
        
        c.on('open', () => {
            updateNameplate(c.peer, c.metadata?.name);
            c.send({ type: 'sys-identity', name: myUsername });
            if (isHostFlag) {
                const peerList = Array.from(connectedPeers).filter(id => id !== c.peer);
                c.send({ type: 'mesh-discovery', peers: peerList });
            }
        });
        
        c.on('data', d => {
            // --- SECURITY VALIDATION LAYER ---
            if (d.type === 'sys-kick' || d.type === 'sys-ban' || d.type === 'sys-room-close') {
                // If a non-host tries to send admin commands, ignore them entirely.
                if (c.peer !== currentRoomId) {
                    console.warn(`SECURITY: Blocked fake admin command from ${c.peer}`);
                    return; 
                }
            }

            if (d.type === 'sys-identity') {
                updateNameplate(c.peer, d.name);
                if (c.peer === currentRoomId) knownHostName = d.name;
                if (!c.announced) { appendSystemMsg(`🔗 ${d.name} joined.`); c.announced = true; }
            } else if (d.type === 'mesh-discovery') {
                d.peers.forEach(peerId => connectToPeer(peerId));
            } else if (d.type === 'sys-kick') {
                if (d.target === peer.id) { 
                    leaveRoom(); setTimeout(() => alert("You were KICKED by the Host."), 100); 
                } else { dropPeer(d.target); }
            } else if (d.type === 'sys-ban') {
                if (d.target === peer.id) { 
                    leaveRoom(); setTimeout(() => alert("You were BANNED by the Host."), 100); 
                } else { dropPeer(d.target); }
            } else if (d.type === 'sys-reject') {
                leaveRoom(); setTimeout(() => alert(`Connection Rejected: ${d.reason}`), 100); 
            } else if (d.type === 'sys-room-close') {
                leaveRoom(); setTimeout(() => alert("The Host has closed the room."), 100);
            } else if (d.type === 'chat' || d.type === 'img') {
                
                // --- RECEIVER-SIDE ANTI-SPAM DEFENSE ---
                const now = Date.now();
                c.recentMessages.push(now);
                c.recentMessages = c.recentMessages.filter(t => now - t <= 5000);
                
                // If a hacked client bypasses their local filter and floods us, drop them instantly.
                if (c.recentMessages.length > 15) {
                    console.warn(`SECURITY: Dropping ${c.peer} for spamming the mesh.`);
                    appendSystemMsg(`🛡️ Blocked ${c.remoteName} for spamming.`);
                    dropPeer(c.peer);
                    return;
                }

                appendMsg(d, false);
            }
        });
        
        c.on('close', () => {
            if (!bannedPeers.has(c.peer)) appendSystemMsg(`🔌 ${c.remoteName} disconnected.`);
            dropPeer(c.peer);
        });
    }

    function broadcast(data) { Object.values(conns).forEach(c => { if (c.open) c.send(data); }); }

    // --- MEDIA CONTROLS ---
    let pttActive = false; const chatInput = document.getElementById('chat-input');
    window.addEventListener('keydown', e => {
        if (e.code === 'Space' && document.activeElement !== chatInput && !pttActive && !clientPrefs.textOnly) {
            e.preventDefault(); pttActive = true;
            if (localStream && localStream.getAudioTracks()[0]) localStream.getAudioTracks()[0].enabled = true;
            document.getElementById('mic-btn').innerText = '🎙️ Speaking...'; document.getElementById('mic-btn').style.background = '#27ae60';
        }
    });

    window.addEventListener('keyup', e => {
        if (e.code === 'Space' && document.activeElement !== chatInput && !clientPrefs.textOnly) {
            pttActive = false;
            if (localStream && localStream.getAudioTracks()[0]) localStream.getAudioTracks()[0].enabled = isMicOn; 
            updateMicUI();
        }
    });

    function toggleMic() {
        if (localStream && localStream.getAudioTracks()[0]) {
            isMicOn = !isMicOn; localStream.getAudioTracks()[0].enabled = isMicOn; updateMicUI();
        }
    }
    function updateMicUI() {
        const btn = document.getElementById('mic-btn');
        btn.innerText = isMicOn ? '🎤 Mic (Hold Space)' : '🔇 Mic Off'; btn.style.background = isMicOn ? '#333' : '#e74c3c';
    }

    function toggleCam() {
        if (localStream && localStream.getVideoTracks()[0]) {
            isCamOn = !isCamOn; localStream.getVideoTracks()[0].enabled = isCamOn;
            const btn = document.getElementById('cam-btn');
            btn.innerText = isCamOn ? '📸 Cam On' : '🚫 Cam Off'; btn.style.background = isCamOn ? '#333' : '#e74c3c';
        }
    }

    async function startScreen() {
        try {
            screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
            Object.keys(conns).forEach(targetId => peer.call(targetId, screenStream, { metadata: { name: myUsername + "'s Screen" } }));
        } catch (e) { console.error(e); }
    }

    function addVideo(stream, labelText, id) {
        if (document.getElementById('vid-' + id)) return;
        const cont = document.createElement('div'); cont.className = 'video-container remote-vid'; cont.id = 'cont-' + id;
        
        let hostBtns = '';
        if (isHostFlag) {
            hostBtns = `<div class="video-controls"><button class="action-btn kick" onclick="executeKick('${id}')">Kick</button><button class="action-btn ban" onclick="executeBan('${id}')">Ban</button></div>`;
        }
        cont.innerHTML = `${hostBtns}<video id="vid-${id}" autoplay playsinline></video><div class="label">${labelText}</div>`;
        document.getElementById('video-section').appendChild(cont);
        document.getElementById('vid-' + id).srcObject = stream;
    }

    // --- CHAT & COMMANDS ---
    function appendMsg(data, me) {
        const d = document.createElement('div'); d.className = `msg ${me ? 'me' : ''}`;
        if (data.type === 'img') d.innerHTML = `<strong>${me ? 'You' : data.name}</strong><br><img src="${data.data}" style="max-width:100%; border-radius:6px; margin-top:6px; max-height:100px; object-fit:cover; cursor:pointer;" onclick="openLightbox('${data.data}')">`;
        else d.innerHTML = `<strong>${me ? 'You' : data.name}</strong><br><span>${data.text}</span>`;
        document.getElementById('msg-history').appendChild(d); d.scrollIntoView();
    }

    function appendSystemMsg(text, isWarn = false) {
        if (document.getElementById('set-hide-sys').checked && !isWarn) return;
        const d = document.createElement('div'); 
        d.className = isWarn ? 'sys-msg sys-warn' : 'sys-msg'; 
        d.innerText = text;
        document.getElementById('msg-history').appendChild(d); d.scrollIntoView();
    }

    function renderCmdBox(title, htmlContent) {
        const d = document.createElement('div'); d.className = 'cmd-box';
        d.innerHTML = `<strong style="color: #2980b9;">${title}</strong>${htmlContent}`;
        document.getElementById('msg-history').appendChild(d); d.scrollIntoView();
    }

    function processCommand(cmd) {
        const base = cmd.toLowerCase().split(' ')[0];
        if (base === '!help') {
            let hostCmds = isHostFlag ? `<li><strong>!settings</strong> - Open Host Controls</li><li><strong>!clearbans</strong> - Wipes room ban list</li>` : "";
            renderCmdBox('🛠️ Available Commands', `<ul><li><strong>!info</strong> - Shows room stats</li><li><strong>!users</strong> - Lists all participants</li><li><strong>!clear</strong> - Wipes local chat</li>${hostCmds}</ul>`);
        } else if (base === '!settings') {
            if (isHostFlag) document.getElementById('host-settings-modal').style.display = 'flex';
            else appendSystemMsg("Only the Host can open room settings.");
        } else if (base === '!clearbans') {
            if (!isHostFlag) appendSystemMsg("Only the Host can clear bans.");
            else { bannedPeers.clear(); bannedNames.clear(); appendSystemMsg("✅ Ban logs cleared."); }
        } else if (base === '!info') {
            let runTimeStr = "Not started";
            if (roomStartTime) {
                const secs = Math.floor((Date.now() - roomStartTime) / 1000);
                runTimeStr = secs > 60 ? `${Math.floor(secs/60)}m ${secs%60}s` : `${secs}s`;
            }
            const cap = hostSettings.maxCapacity;
            renderCmdBox('📊 Room Info', `<ul><li><strong>Host:</strong> ${isHostFlag ? myUsername : knownHostName}</li><li><strong>Room Code:</strong> ${currentRoomId}</li><li><strong>Run-time:</strong> ${runTimeStr}</li><li><strong>Participants:</strong> ${connectedPeers.size + 1} / ${cap}</li></ul>`);
        } else if (base === '!users') {
            let userListHtml = `<li>${myUsername} (You) ${isHostFlag ? '👑' : ''}</li>`;
            Object.values(conns).forEach(c => { if (c.open) userListHtml += `<li>${c.remoteName || "User"} ${(c.peer === currentRoomId) ? '👑' : ''}</li>`; });
            renderCmdBox('👥 Participants', `<ul>${userListHtml}</ul>`);
        } else if (base === '!clear') {
            document.getElementById('msg-history').innerHTML = ''; appendSystemMsg("Chat cleared.");
        } else { appendSystemMsg(`Unknown command. Type !help.`); }
    }

    // --- SPAM RATE LIMITER ---
    function checkSpamRateLimit() {
        const now = Date.now();
        msgTimestamps.push(now);
        msgTimestamps = msgTimestamps.filter(t => now - t <= 5000); 
        
        if (msgTimestamps.length >= 10) {
            spamInfractions++;
            msgTimestamps = []; 
            
            if (spamInfractions >= 5) {
                leaveRoom();
                setTimeout(() => alert("You have been kicked from the room for repeated spamming."), 100);
                return;
            }
            
            isChatLocked = true;
            chatInput.disabled = true;
            document.getElementById('attach-btn').disabled = true;
            
            const muteTime = 3000 * spamInfractions; 
            chatInput.placeholder = `Muted for ${muteTime/1000}s...`;
            appendSystemMsg(`⚠️ SPAM DETECTED. Muted for ${muteTime/1000} seconds. (Strike ${spamInfractions}/4)`, true);
            
            setTimeout(() => {
                isChatLocked = false;
                chatInput.disabled = false;
                chatInput.placeholder = "Type a message or !help";
                document.getElementById('attach-btn').disabled = false;
                appendSystemMsg("✅ You are unmuted. Please send messages slower.", false);
            }, muteTime);
        }
    }

    function sendImage(input) {
        if (isChatLocked) return alert("You are sending messages too fast! Wait a moment.");
        const file = input.files[0];
        if (!file || file.size > 2 * 1024 * 1024) return alert("Image too large! Max 2MB.");
        
        checkSpamRateLimit(); 
        if (isChatLocked) return;
        
        const reader = new FileReader();
        reader.onload = e => {
            const msgObj = { type: 'img', data: e.target.result, name: myUsername };
            broadcast(msgObj); appendMsg(msgObj, true);
        };
        reader.readAsDataURL(file);
    }

    function openLightbox(src) { document.getElementById('lightbox-img').src = src; document.getElementById('lightbox').style.display = 'flex'; }

    window.onkeydown = e => {
        if (e.key === 'Enter' && document.activeElement === chatInput && chatInput.value.trim()) {
            if (isChatLocked) return;
            
            const text = chatInput.value.trim();
            if (text.startsWith('!')) {
                processCommand(text); chatInput.value = ''; return; 
            }

            checkSpamRateLimit();
            if (isChatLocked) return;

            const msgObj = { type: 'chat', text: text, name: myUsername };
            broadcast(msgObj); appendMsg(msgObj, true); chatInput.value = '';
        }
    };
</script>
</body>
</html>
